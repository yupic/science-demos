<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Полигенность: рост</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    if (window.self !== window.top) document.documentElement.classList.add('in-iframe');
  </script>
  <link rel="stylesheet" href="styles.css" />
  <script src="sd.js"></script>
  <style>
    html.in-iframe .container > h1, html.in-iframe #introText, html.in-iframe footer { display: none; }
    .polygenicity-layout { display: grid; grid-template-columns: minmax(230px, 310px) minmax(0, 1fr); grid-template-areas: "card chart-title" "card chart"; column-gap: 10px; }
    .polygenicity-card { grid-area: card; display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.03); }
    .polygenicity-card h2 { margin-top: 0; }
    .check-label { display: flex; align-items: center; gap: 7px; margin: 10px 0; font-size: 14px; cursor: pointer; }
    .effect-list { flex: 1 1 0; min-height: 0; overflow-y: auto; margin: 12px 0 0; padding-left: 20px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .effect-list code { color: var(--fg); background: #f0f4ff; padding: 1px 4px; border-radius: 3px; }
    .chart-title { grid-area: chart-title; margin: 0 0 6px; font-size: 15px; font-weight: 600; }
    .polygenicity-layout > .canvas-frame { grid-area: chart; }
    .chart-hover-label {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 18px;
      padding: 8px 12px 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      text-align: left;
    }
    .chart-hover-field { display: grid; grid-template-columns: var(--label-width) minmax(0, 1fr); flex: 0 1 var(--field-width); column-gap: 5px; }
    .chart-hover-field--height { --label-width: 35px; --field-width: 110px; }
    .chart-hover-field--probability { --label-width: 85px; --field-width: 170px; }
    .chart-hover-field--genotypes { --label-width: 170px; --field-width: 310px; }
    .chart-hover-field strong { color: var(--fg); }
    @media (max-width: 800px) {
      .polygenicity-layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "card" "chart-title" "chart"; row-gap: 10px; }
      .polygenicity-card { display: block; overflow: visible; }
      .effect-list { max-height: 360px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Полигенность на примере роста</h1>
  <p id="introText" class="desc"></p>

  <div class="controls">
    <label class="slider-label">Кол-во локусов:
      <input id="variantCount" type="range" min="1" max="300" value="1" style="width: 100px;" />
      <input id="variantNumber" type="number" min="1" max="300" value="1" style="width: 60px;" />
    </label>
    <label class="check-label"><input id="randomFrequencies" type="checkbox" /> Случайные частоты аллелей</label> |
    <label class="check-label"><input id="randomEffects" type="checkbox" /> Случайные эффекты аллелей |</label>
    <label class="mut-label">Точность:
      <select id="precisionSelect">
        <option value="1" selected>1 см</option>
        <option value="10">0,1 см</option>
        <option value="100">0,01 см</option>
      </select>
    </label>
    <button id="regenBtn" type="button">Обновить</button>
  </div>

  <div id="statsLine" class="stats"></div>

  <div class="polygenicity-layout">
    <section class="polygenicity-card">
      <h2>Эффекты и частоты вторых аллелей</h2>
      <ol id="effectsList" class="effect-list"></ol>
    </section>
    <p class="chart-title">Распределение вероятностей роста</p>
    <div class="canvas-frame">
      <div class="chart-hover-label">
        <span class="chart-hover-field chart-hover-field--height"><span>Рост:</span><strong id="hoverHeight">—</strong></span>
        <span class="chart-hover-field chart-hover-field--probability"><span>Вероятность:</span><strong id="hoverProbability">—</strong></span>
        <span class="chart-hover-field chart-hover-field--genotypes"><span>Генотипов с этим ростом:</span><strong id="hoverGenotypes">—</strong></span>
      </div>
      <canvas id="heightCanvas"></canvas>
    </div>
  </div>
</div>

<footer class="footer">

  <a href="https://github.com/yupic/science-demos" target="_blank" rel="noopener">GitHub</a> •
  <a href="https://www.youtube.com/@autism-ru" target="_blank" rel="noopener">YouTube</a> •
  <a href="https://t.me/autism_science" target="_blank" rel="noopener">Telegram</a>
</footer>

<script>
  // Change only these two constants to use a different height interval.
  const MIN_HEIGHT = 120;
  const MAX_HEIGHT = 220;
  const BASE_HEIGHT = MIN_HEIGHT;
  const TOTAL_EFFECT = MAX_HEIGHT - MIN_HEIGHT;
  const MAX_VARIANTS = 300;
  const EFFECT_CV = 0.5;
  const SOURCE_EFFECT_UNITS_PER_CM = 100; // Effects are always generated at 0.01 cm.

  const countRange = document.getElementById('variantCount');
  const countNumber = document.getElementById('variantNumber');
  const randomFrequencies = document.getElementById('randomFrequencies');
  const randomEffects = document.getElementById('randomEffects');
  const precisionSelect = document.getElementById('precisionSelect');
  const regenBtn = document.getElementById('regenBtn');
  const statsLine = document.getElementById('statsLine');
  const introText = document.getElementById('introText');
  const effectsList = document.getElementById('effectsList');
  const canvas = document.getElementById('heightCanvas');
  const ctx = canvas.getContext('2d');
  const hoverHeight = document.getElementById('hoverHeight');
  const hoverProbability = document.getElementById('hoverProbability');
  const hoverGenotypes = document.getElementById('hoverGenotypes');

  let settingsKey = '';
  let frequencies = [];
  let rawEffectUnits = [];
  let lastRandomEffectPrecision = '1';
  let currentDistribution = [];
  let phenotypeGenotypeCounts = [];
  let possiblePhenotypeCount = 0;
  let displayCache = null;
  let lastDraw = null;
  let hoverIndex = null;
  let hoverX = null;

  introText.innerHTML =
    `Начальный рост — <strong>${MIN_HEIGHT} см</strong>. Каждый локус имеет два аллеля: ` +
    `один ничего не добавляет, другой увеличивает рост.`;

  function clampCount(value) {
    const parsed = Math.round(Number(value));
    return Number.isFinite(parsed) ? Math.max(1, Math.min(MAX_VARIANTS, parsed)) : 1;
  }

  function formatCm(value) {
    const rounded = Math.round(value * 100) / 100;
    return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(2).replace('.', ',');
  }

  function formatHeight(value) {
    return value.toFixed(2).replace('.', ',');
  }

  function formatPercent(probability) {
    const percent = probability * 100;
    if (percent >= 0.01) return `${percent.toFixed(2).replace('.', ',')}%`;
    if (percent === 0) return '0%';
    const exponent = Math.floor(Math.log10(percent));
    const mantissa = percent / (10 ** exponent);
    return `${mantissa.toFixed(1).replace('.', ',')}×10${toSuperscript(exponent)}%`;
  }

  function toSuperscript(value) {
    const glyphs = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
    return String(value).split('').map((char) => glyphs[char]).join('');
  }

  function randomEffectUnits(n, unitsPerCm) {
    const totalUnits = TOTAL_EFFECT * unitsPerCm;
    const availableUnits = totalUnits - n;
    const halfWidth = Math.sqrt(3) * EFFECT_CV;
    const rawWeights = Array.from({ length: n }, () => 1 - halfWidth + Math.random() * 2 * halfWidth);
    const rawSum = rawWeights.reduce((sum, weight) => sum + weight, 0);
    const quotas = rawWeights.map((weight) => (availableUnits * weight) / rawSum);
    const units = quotas.map((quota) => 1 + Math.floor(quota));
    const remainder = totalUnits - units.reduce((sum, unit) => sum + unit, 0);
    quotas
      .map((quota, index) => ({ index, fraction: quota - Math.floor(quota) }))
      .sort((a, b) => b.fraction - a.fraction)
      .slice(0, remainder)
      .forEach(({ index }) => { units[index] += 1; });
    return units;
  }

  function syncPrecisionControl() {
    precisionSelect.disabled = !randomEffects.checked;
    if (!randomEffects.checked) precisionSelect.value = String(SOURCE_EFFECT_UNITS_PER_CM);
  }

  function refreshParameters(n) {
    const nextKey = `${n}|${randomFrequencies.checked}|${randomEffects.checked}`;
    if (nextKey === settingsKey) return;
    settingsKey = nextKey;
    frequencies = randomFrequencies.checked
      ? Array.from({ length: n }, () => 0.1 + Math.random() * 0.8)
      : new Array(n).fill(0.5);
    rawEffectUnits = randomEffects.checked
      ? randomEffectUnits(n, SOURCE_EFFECT_UNITS_PER_CM)
      : null;
  }

  function calculateDistribution(n) {
    // The model always uses hundredths of a centimeter. Display precision is applied later.
    if (!randomEffects.checked) {
      let probabilities = [1];
      for (const p of frequencies) {
        const next = new Array(probabilities.length + 1).fill(0);
        probabilities.forEach((probability, count) => {
          next[count] += probability * (1 - p);
          next[count + 1] += probability * p;
        });
        probabilities = next;
      }
      const binnedProbabilities = new Array(TOTAL_EFFECT * SOURCE_EFFECT_UNITS_PER_CM + 1).fill(0);
      probabilities.forEach((probability, count) => {
        const units = Math.round((TOTAL_EFFECT * SOURCE_EFFECT_UNITS_PER_CM * count) / n);
        binnedProbabilities[units] += probability;
      });
      return binnedProbabilities
        .map((probability, units) => ({
          height: BASE_HEIGHT + units / SOURCE_EFFECT_UNITS_PER_CM,
          probability,
          units
        }))
        .filter((entry) => entry.probability > 0);
    }

    let probabilities = [1];
    for (let locus = 0; locus < n; locus += 1) {
      const effect = rawEffectUnits[locus];
      const p = frequencies[locus];
      const next = new Array(probabilities.length + effect).fill(0);
      probabilities.forEach((probability, units) => {
        next[units] += probability * (1 - p);
        next[units + effect] += probability * p;
      });
      probabilities = next;
    }
    return probabilities.map((probability, units) => ({
      height: BASE_HEIGHT + units / SOURCE_EFFECT_UNITS_PER_CM,
      probability,
      units
    })).filter((entry) => entry.probability > 0 /*1e-15*/);
  }

  function calculatePhenotypeGenotypeCounts(n) {
    if (!randomEffects.checked) {
      const counts = new Array(TOTAL_EFFECT * SOURCE_EFFECT_UNITS_PER_CM + 1).fill(0n);
      let exactCounts = [1n];
      for (let locus = 0; locus < n; locus += 1) {
        const next = new Array(exactCounts.length + 1).fill(0n);
        exactCounts.forEach((count, alleles) => {
          next[alleles] += count;
          next[alleles + 1] += count;
        });
        exactCounts = next;
      }
      exactCounts.forEach((count, alleles) => {
        const units = Math.round((TOTAL_EFFECT * SOURCE_EFFECT_UNITS_PER_CM * alleles) / n);
        counts[units] += count;
      });
      return counts;
    }
    const totalUnits = TOTAL_EFFECT * SOURCE_EFFECT_UNITS_PER_CM;
    const counts = new Array(totalUnits + 1).fill(0n);
    counts[0] = 1n;
    for (const effect of rawEffectUnits) {
      for (let units = totalUnits - effect; units >= 0; units -= 1) {
        if (counts[units] !== 0n) counts[units + effect] += counts[units];
      }
    }
    return counts;
  }

  function calculatePhenotypeCount(n) {
    if (!randomEffects.checked) {
      const phenotypeUnits = new Set();
      for (let alleles = 0; alleles <= n; alleles += 1) {
        phenotypeUnits.add(Math.round((TOTAL_EFFECT * SOURCE_EFFECT_UNITS_PER_CM * alleles) / n));
      }
      return phenotypeUnits.size;
    }
    const reachable = new Array(TOTAL_EFFECT * SOURCE_EFFECT_UNITS_PER_CM + 1).fill(false);
    reachable[0] = true;
    for (const effect of rawEffectUnits) {
      for (let units = reachable.length - 1 - effect; units >= 0; units -= 1) {
        if (reachable[units]) reachable[units + effect] = true;
      }
    }
    return reachable.filter(Boolean).length;
  }

  function updateStats() {
    const n = clampCount(countRange.value);
    const genotypeCount = formatBigIntCount(2n ** BigInt(n));
    const mean = currentDistribution.reduce((sum, item) => sum + item.height * item.probability, 0);
    statsLine.innerHTML =
      `Кол-во генотипов: <span class="value-strong">${genotypeCount}</span>` +
      ` | Кол-во фенотипов: <span class="value-strong">${possiblePhenotypeCount.toLocaleString('ru-RU')}</span>` +
      ` | Средний рост: <span class="value-strong">${formatHeight(mean)} см</span>`;
  }

  function formatBigIntCount(value) {
    if (value <= 1_000_000_000n) return value.toLocaleString('ru-RU');
    const digits = value.toString();
    let exponent = digits.length - 1;
    let tenths = Number(digits.slice(0, 2));
    if (Number(digits[2] || '0') >= 5) tenths += 1;
    if (tenths >= 100) {
      tenths = 10;
      exponent += 1;
    }
    return `${(tenths / 10).toFixed(1).replace('.', ',')}×10${toSuperscript(exponent)}`;
  }

  function buildDisplayBars(xForHeight, innerWidth, dpr, xRange) {
    const precision = Number(precisionSelect.value);
    const stepUnits = SOURCE_EFFECT_UNITS_PER_CM / precision;
    const decimals = Math.round(Math.log10(precision));
    // Merge neighboring display cells when their grid step is narrower than a physical pixel.
    const pixelBins = randomEffects.checked && precision > 1
      && stepUnits * innerWidth * dpr < SOURCE_EFFECT_UNITS_PER_CM * xRange;
    const roundedBins = new Map();
    for (const item of currentDistribution) {
      const roundedUnits = Math.round(item.units / stepUnits) * stepUnits;
      let bin = roundedBins.get(roundedUnits);
      if (!bin) {
        bin = { index: roundedUnits / stepUnits, centerUnits: roundedUnits,
          probability: 0, genotypes: 0n };
        roundedBins.set(roundedUnits, bin);
      }
      bin.probability += item.probability;
      bin.genotypes += phenotypeGenotypeCounts[item.units];
    }

    let bins = Array.from(roundedBins.values());
    if (pixelBins) {
      const displayedGenotypes = bins.reduce((sum, bin) => sum + bin.genotypes, 0n);
      const scale = 1_000_000_000n;
      const pixels = new Map();
      for (const bin of bins) {
        const center = BASE_HEIGHT + bin.centerUnits / SOURCE_EFFECT_UNITS_PER_CM;
        const halfStep = stepUnits / (2 * SOURCE_EFFECT_UNITS_PER_CM);
        const leftPx = xForHeight(center - halfStep) * dpr;
        const rightPx = xForHeight(center + halfStep) * dpr;
        const lastPixel = Math.ceil(rightPx) - 1;
        let allocated = 0n;
        for (let pixel = Math.floor(leftPx); pixel <= lastPixel; pixel += 1) {
          const overlap = Math.max(0, Math.min(rightPx, pixel + 1) - Math.max(leftPx, pixel));
          if (overlap === 0) continue;
          const fraction = overlap / (rightPx - leftPx);
          const weight = pixel === lastPixel ? scale - allocated : BigInt(Math.round(fraction * Number(scale)));
          allocated += weight;
          let target = pixels.get(pixel);
          if (!target) {
            target = { index: pixel, minUnits: bin.centerUnits, probability: 0, weightedGenotypes: 0n };
            pixels.set(pixel, target);
          }
          target.minUnits = Math.min(target.minUnits, bin.centerUnits);
          target.probability += bin.probability * fraction;
          target.weightedGenotypes += bin.genotypes * weight;
        }
      }
      bins = Array.from(pixels.values());
      let assigned = 0n;
      for (const bin of bins) {
        bin.genotypes = bin.weightedGenotypes / scale;
        bin.remainder = bin.weightedGenotypes % scale;
        assigned += bin.genotypes;
      }
      const missing = displayedGenotypes - assigned;
      bins.slice().sort((a, b) => a.remainder === b.remainder ? a.index - b.index : a.remainder > b.remainder ? -1 : 1)
        .slice(0, Number(missing)).forEach((bin) => { bin.genotypes += 1n; });
    }

    const minGapUnits = !randomEffects.checked && currentDistribution.length > 1
      ? Math.min(...currentDistribution.slice(1).map((item, i) => item.units - currentDistribution[i].units))
      : TOTAL_EFFECT * SOURCE_EFFECT_UNITS_PER_CM;
    const oneCmFixedBars = !randomEffects.checked && minGapUnits >= SOURCE_EFFECT_UNITS_PER_CM;
    const barWidthCm = !randomEffects.checked
      ? Math.min(1, minGapUnits / SOURCE_EFFECT_UNITS_PER_CM) * 0.9
      : (stepUnits / SOURCE_EFFECT_UNITS_PER_CM) * (precision === 1 ? 0.9 : 1);
    const formatUnit = (units) => (BASE_HEIGHT + units / SOURCE_EFFECT_UNITS_PER_CM)
      .toFixed(decimals).replace('.', ',');
    const bars = bins.sort((a, b) => a.index - b.index).map((bin) => {
      let left;
      let right;
      if (pixelBins) {
        left = bin.index / dpr;
        right = left + 1 / dpr;
      } else if (randomEffects.checked && precision !== 1) {
        // Shared edges snap to physical pixels, so adjacent fine-grid bars have no seams.
        left = Math.round(xForHeight(BASE_HEIGHT + (bin.index - 0.5) * stepUnits / SOURCE_EFFECT_UNITS_PER_CM) * dpr) / dpr;
        right = Math.round(xForHeight(BASE_HEIGHT + (bin.index + 0.5) * stepUnits / SOURCE_EFFECT_UNITS_PER_CM) * dpr) / dpr;
      } else {
        const center = BASE_HEIGHT + bin.centerUnits / SOURCE_EFFECT_UNITS_PER_CM;
        const visualCenter = center + (oneCmFixedBars ? 0.5 : 0);
        left = xForHeight(visualCenter - barWidthCm / 2);
        right = xForHeight(visualCenter + barWidthCm / 2);
      }
      return { ...bin, left, right, label: `${formatUnit(pixelBins ? bin.minUnits : bin.centerUnits)} см`,
        approximate: pixelBins };
    });
    const centers = bars.map((bar) => pixelBins
      ? (bar.left + bar.right) / 2
      : xForHeight(BASE_HEIGHT + bar.centerUnits / SOURCE_EFFECT_UNITS_PER_CM));
    const halfCm = xForHeight(BASE_HEIGHT + 0.5) - xForHeight(BASE_HEIGHT);
    return bars.map((bar, index) => {
      const center = centers[index];
      if (oneCmFixedBars) {
        const height = BASE_HEIGHT + bar.centerUnits / SOURCE_EFFECT_UNITS_PER_CM;
        return { ...bar, hoverLeft: xForHeight(height), hoverRight: xForHeight(height + 1) };
      }
      const radius = Math.max(halfCm, (bar.right - bar.left) / 2);
      const leftMidpoint = index > 0 ? (centers[index - 1] + center) / 2 : -Infinity;
      const rightMidpoint = index + 1 < bars.length ? (center + centers[index + 1]) / 2 : Infinity;
      // Keep a shared midpoint when the half-centimeter limit only differs by floating-point noise.
      return { ...bar,
        hoverLeft: leftMidpoint >= center - radius - 1e-9 ? leftMidpoint : center - radius,
        hoverRight: rightMidpoint <= center + radius + 1e-9 ? rightMidpoint : center + radius };
    });
  }

  function draw() {
    updateStats();
    const dpr = window.devicePixelRatio || 1;
    const displayWidth = canvas.clientWidth || canvas.parentElement.clientWidth || 600;
    const height = window.self !== window.top
      ? Math.max(310, Math.min(760, Math.floor(window.innerHeight - canvas.getBoundingClientRect().top - (window.scrollY || 0) - 12)))
      : Math.max(310, Math.min(window.innerHeight * 0.60, 520));
    canvas.style.height = `${height}px`;
    canvas.width = Math.floor(displayWidth * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, displayWidth, height);

    const margin = { left: 64, right: 16, top: 12, bottom: 32 };
    const innerWidth = displayWidth - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    const xMinEdge = BASE_HEIGHT - 0.5;
    const xMaxEdge = BASE_HEIGHT + TOTAL_EFFECT + (!randomEffects.checked && clampCount(countRange.value) <= TOTAL_EFFECT ? 1 : 0.5);
    const xRange = xMaxEdge - xMinEdge;
    const xForHeight = (heightCm) => margin.left + ((heightCm - xMinEdge) / xRange) * innerWidth;
    const precision = Number(precisionSelect.value);
    if (!displayCache || displayCache.width !== displayWidth || displayCache.dpr !== dpr || displayCache.precision !== precision) {
      displayCache = { width: displayWidth, dpr, precision,
        bars: buildDisplayBars(xForHeight, innerWidth, dpr, xRange) };
    }
    const bars = displayCache.bars;
    const yMax = Math.max(...bars.map((bar) => bar.probability), Number.EPSILON);

    ctx.fillStyle = '#f8f9fc';
    ctx.fillRect(margin.left, margin.top, innerWidth, innerHeight);
    ctx.strokeStyle = '#d6dbe3';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i += 1) {
      const y = margin.top + innerHeight - (i / 4) * innerHeight;
      ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(margin.left + innerWidth, y); ctx.stroke();
      ctx.fillStyle = '#444'; ctx.font = '12px system-ui, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(`${((i / 4) * yMax * 100).toFixed(1).replace('.', ',')}%`, margin.left - 8, y);
    }

    bars.forEach((bar, index) => {
      const barHeight = bar.probability / yMax * innerHeight;
      const isHovered = index === hoverIndex;
      ctx.fillStyle = isHovered ? '#e67e22' : '#2c7be5';
      ctx.fillRect(bar.left, margin.top + innerHeight - barHeight, bar.right - bar.left, barHeight);
    });

    if (hoverX !== null) {
      const hovered = hoverIndex === null ? null : bars[hoverIndex];
      const heightUnderPointer = xMinEdge + ((hoverX - margin.left) / innerWidth) * xRange;
      const gridUnits = Number(precisionSelect.value);
      const displayUnits = Math.round((heightUnderPointer - BASE_HEIGHT) * gridUnits);
      const fallbackHeight = (BASE_HEIGHT + displayUnits / gridUnits)
        .toFixed(Math.round(Math.log10(gridUnits))).replace('.', ',');
      hoverHeight.textContent = hovered?.label ?? `${fallbackHeight} см`;
      hoverProbability.textContent = formatPercent(hovered?.probability ?? 0);
      hoverGenotypes.textContent = hovered ? formatBigIntCount(hovered.genotypes) : 'не встречается';
      ctx.strokeStyle = '#344054';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(hoverX, margin.top);
      ctx.lineTo(hoverX, margin.top + innerHeight);
      ctx.stroke();
    } else {
      hoverHeight.textContent = '—';
      hoverProbability.textContent = '—';
      hoverGenotypes.textContent = '—';
    }

    ctx.strokeStyle = '#999';
    ctx.beginPath(); ctx.moveTo(margin.left, margin.top + innerHeight); ctx.lineTo(margin.left + innerWidth, margin.top + innerHeight); ctx.stroke();
    const labels = generateXTicks({ min: BASE_HEIGHT, max: BASE_HEIGHT + TOTAL_EFFECT }, innerWidth);
    const labelStep = labels.length >= 2 ? Math.abs(labels[1] - labels[0]) : 1;
    const decimals = labelStep >= 1 ? 0 : Math.max(0, Math.min(6, Math.ceil(-Math.log10(labelStep))));
    ctx.fillStyle = '#444'; ctx.font = '12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    labels.forEach((heightCm) => {
      const x = xForHeight(heightCm);
      ctx.beginPath(); ctx.moveTo(x, margin.top + innerHeight); ctx.lineTo(x, margin.top + innerHeight + 4); ctx.stroke();
      const text = decimals === 0 ? String(Math.round(heightCm)) : Number(heightCm.toFixed(decimals)).toString().replace('.', ',');
      ctx.fillText(text, x, margin.top + innerHeight + 7);
    });
    ctx.save(); ctx.translate(11, margin.top + innerHeight / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText('Вероятность', 0, 0); ctx.restore();
    lastDraw = { bars, plotLeft: margin.left, plotRight: margin.left + innerWidth,
      plotTop: margin.top, plotBottom: margin.top + innerHeight };
  }

  function render() {
    const n = clampCount(countRange.value);
    countRange.value = n;
    countNumber.value = n;
    refreshParameters(n);
    syncPrecisionControl();
    currentDistribution = calculateDistribution(n);
    phenotypeGenotypeCounts = calculatePhenotypeGenotypeCounts(n);
    possiblePhenotypeCount = calculatePhenotypeCount(n);
    displayCache = null;
    const equalEffect = TOTAL_EFFECT / n;
    effectsList.innerHTML = '';
    for (let i = 0; i < n; i += 1) {
      const li = document.createElement('li');
      const probability = frequencies[i];
      const sourceEffect = randomEffects.checked ? rawEffectUnits[i] / SOURCE_EFFECT_UNITS_PER_CM : equalEffect;
      const effectText = randomEffects.checked ? `+${sourceEffect.toFixed(2).replace('.', ',')}` : `+${formatCm(sourceEffect)}`;
      li.innerHTML = `Локус ${i + 1}: <code>${effectText} см</code>, частота <code>${formatPercent(probability)}</code>`;
      effectsList.appendChild(li);
    }
    hoverIndex = null;
    hoverX = null;
    draw();
  }

  function syncFromRange() { countNumber.value = countRange.value; render(); }
  function syncFromNumber() { countRange.value = clampCount(countNumber.value); render(); }
  countRange.addEventListener('input', syncFromRange);
  countNumber.addEventListener('input', syncFromNumber);
  randomFrequencies.addEventListener('change', () => { settingsKey = ''; render(); });
  randomEffects.addEventListener('change', () => {
    if (randomEffects.checked) precisionSelect.value = lastRandomEffectPrecision;
    settingsKey = '';
    render();
  });
  precisionSelect.addEventListener('change', () => {
    if (!randomEffects.checked) return;
    lastRandomEffectPrecision = precisionSelect.value;
    hoverIndex = null;
    hoverX = null;
    displayCache = null;
    draw();
  });
  regenBtn.addEventListener('click', () => { settingsKey = ''; render(); });
  canvas.addEventListener('mousemove', (event) => {
    if (!lastDraw) return;
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    const insidePlot = x >= lastDraw.plotLeft && x <= lastDraw.plotRight &&
      y >= lastDraw.plotTop && y <= lastDraw.plotBottom;
    const next = insidePlot ? lastDraw.bars.findIndex((bar) => x >= bar.hoverLeft && x < bar.hoverRight) : -1;
    const nextIndex = next === -1 ? null : next;
    const nextX = insidePlot ? x : null;
    if (nextIndex !== hoverIndex || nextX !== hoverX) {
      hoverIndex = nextIndex;
      hoverX = nextX;
      draw();
    }
  });
  canvas.addEventListener('mouseleave', () => {
    if (hoverX !== null) { hoverIndex = null; hoverX = null; draw(); }
  });
  window.addEventListener('resize', () => { hoverIndex = null; hoverX = null; draw(); });
  render();
</script>
</body>
</html>
